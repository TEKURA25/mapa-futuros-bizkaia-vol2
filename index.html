<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Futuros que se cultivan en Bizkaia. Vol. 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #map { width: 100%; height: 100%; }

    #pdf-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 1000; }
    #pdf-container { position: relative; width: 90%; height: 90%; background: #111;
      box-shadow: 0 0 30px rgba(0,0,0,0.7); border-radius: 8px; overflow: hidden;
      display: flex; flex-direction: column; }
    #pdf-frame { flex: 1; width: 100%; border: none; background: #111; }
    #close-btn { position: absolute; top: 8px; right: 12px; z-index: 1001;
      background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 20px;
      padding: 4px 10px; font-size: 20px; cursor: pointer; }
    #close-btn:hover { background: rgba(0,0,0,0.9); }

    .pin-icon { background: transparent !important; border: none !important; }
    .leaflet-tooltip { font-size: 12px; padding: 4px 7px; line-height: 1.35; }
    .leaflet-tooltip .dir { color: #555; font-size: 11px; }
    .leaflet-tooltip .prep { color: #8a6d00; font-size: 11px; font-style: italic; }

    .btn-ficha { margin-top: 8px; border: 0; border-radius: 16px; padding: 7px 14px;
      background: #7b1433; color: #fff; font-size: 13px; cursor: pointer; }
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.4; }
    .leaflet-popup-content .dir { color: #555; font-size: 12px; }
    .leaflet-popup-content .prep { color: #8a6d00; font-size: 12px; font-style: italic; }
    @media (max-width: 768px) {
      .titulo { font-size: 11px; max-width: 200px; padding: 5px 8px; }
    }
    .titulo { font-size: 11px; max-width: 200px; padding: 5px 8px; }
    }
    /* Leyenda por temática, con filtro */
    .leyenda { background: rgba(255,255,255,0.94); padding: 8px 10px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25); font-size: 12px; color: #222; max-width: 230px; }
    .leyenda h4 { margin: 0 0 6px; font-size: 13px; color: #7b1433; }
    .leyenda label { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
    .leyenda .sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #333; flex: none; }
    .leyenda .nota { margin-top: 6px; font-size: 11px; color: #555; }
    .leyenda-toggle { display: none; }
    @media (max-width: 768px) {
      .leyenda { max-width: 180px; font-size: 11px; }
      .leyenda.cerrada .cuerpo { display: none; }
      .leyenda-toggle { display: inline; float: right; border: 0; background: none;
        font-size: 13px; cursor: pointer; color: #7b1433; }
    }

    .titulo { background: rgba(255,255,255,0.92); padding: 6px 10px; border-radius: 6px;
      font-size: 13px; color: #7b1433; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }

    /* Modo edición (?editar=1): para colocar cada pin en su dirección exacta */
    #panel-editar { position: fixed; left: 10px; bottom: 24px; z-index: 900; width: 360px;
      max-width: calc(100% - 20px); background: #fff; border-radius: 6px; padding: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3); font-size: 12px; display: none; }
    #panel-editar textarea { width: 100%; height: 140px; font-family: monospace; font-size: 11px;
      box-sizing: border-box; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="pdf-overlay">
  <div id="pdf-container">
    <button id="close-btn" title="Cerrar ficha">✕</button>
    <iframe id="pdf-frame" src="" title="Ficha de la iniciativa"></iframe>
  </div>
</div>

<div id="panel-editar">
  <strong>Modo edición.</strong> Arrastra cada pin a su dirección. Las coordenadas nuevas aparecen aquí:
  <textarea id="salida" readonly></textarea>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  const PDF_FILE = "fichas_vol2.pdf";

  // Temáticas del Vol. 2 (mapa vigente del 02/11/2026)
  const TEMAS = {
    voz:        { nombre: "Voz y comunicación",        color: "#7b1433" },
    trabajo:    { nombre: "Dignidad y trabajo",        color: "#c0632b" },
    autonomia:  { nombre: "Autonomía y envejecimiento", color: "#d9a520" },
    salud:      { nombre: "Salud y bienestar",         color: "#2f7fb5" },
    educacion:  { nombre: "Educación e inclusión",     color: "#7a4fa3" },
    movilidad:  { nombre: "Movilidad y ciudad",        color: "#4a4a4a" },
    lengua:     { nombre: "Lengua e identidad",        color: "#c2417a" },
    territorio: { nombre: "Territorio y vida",         color: "#177a3b" },
    transversal:{ nombre: "Transversales",             color: "#1f9c9c" }
  };

  // Una entrada por punto. page = página de la ficha en fichas_vol2.pdf.
  // dir = dirección que se muestra al pasar por encima (fuente en mapa_iniciativas_direcciones.csv).
  // aprox = true: coordenadas aproximadas, pendientes de colocar en la dirección exacta.
  // prep = true: ficha en preparación (dummy en el borrador).
  const iniciativas = [
    { id:"3dlan-getxo",  name:"3DLAN",  tema:"educacion", page:1,  lat:43.3440, lng:-3.0060, dir:"Urgull kalea 4 (Getxo Sormen Hub), 48991 Getxo", aprox:true },
    { id:"baiby",        name:"bai&by", tema:"lengua",    page:2,  lat:43.2617, lng:-2.9310, dir:"Alameda de Urkijo 22, Bilbao (academia)", aprox:true },
    { id:"apnabi-bio",   name:"APNABI Autismo Bizkaia", tema:"educacion", page:3, lat:43.2650, lng:-2.9480, dir:"Sabino Arana 69, 48012 Bilbao", aprox:true },
    { id:"ihobe",        name:"Soluciones Basadas en la Naturaleza. Ihobe", tema:"territorio", page:4, lat:43.2612, lng:-2.9395, dir:"Ihobe, Alameda Urquijo 36, 48011 Bilbao", aprox:true, prep:true },
    { id:"sanluis",      name:"Centro San Luis Indautxu", tema:"educacion", page:5, lat:43.2625, lng:-2.9400, dir:"Licenciado Poza 31, 48011 Bilbao", aprox:true },
    { id:"gaman",        name:"Gaman", tema:"autonomia", page:6, lat:43.2870, lng:-2.8560, dir:"Polígono Ugaldeguren III, parcela 28B, 48170 Zamudio", aprox:true },
    { id:"gaptain",      name:"Gaptain", tema:"educacion", page:7, lat:43.4050, lng:-2.9460, dir:"Plentzia (48620)", aprox:true },
    { id:"heuristik",    name:"Heuristik", tema:"salud", page:8, lat:43.2900, lng:-2.8650, dir:"Zamudio", aprox:true },
    { id:"kuvu",         name:"Kuvu", tema:"autonomia", page:9, lat:43.2660, lng:-2.9285, dir:"Uribitarte 6, 48001 Bilbao", aprox:true },
    { id:"koiki",        name:"Koiki", tema:"movilidad", page:10, lat:43.2580, lng:-2.9250, dir:"Bilbao (dirección pendiente)", aprox:true },
    { id:"gogoa",        name:"Gogoa", tema:"autonomia", page:11, lat:43.1540, lng:-2.6100, dir:"Arzubia 10b, 48220 Abadiño", aprox:true, prep:true },
    { id:"qubiz-bio",    name:"Qubiz.team", tema:"transversal", page:12, lat:43.2627, lng:-2.9250, dir:"Torre BAT, Gran Vía 1, 48001 Bilbao", aprox:true, prep:true },
    { id:"sua",          name:"SUA Solutions", tema:"autonomia", page:13, lat:43.2622, lng:-2.9262, dir:"Torre BAT, Bilbao (por confirmar)", aprox:true, prep:true },
    { id:"ubikare",      name:"Ubikare", tema:"salud", page:14, lat:43.3050, lng:-2.9730, dir:"Erandio", aprox:true },
    { id:"pappstor",     name:"Pappstor", tema:"territorio", page:15, lat:43.2560, lng:-2.9150, dir:"Bilbao (dirección pendiente)", aprox:true, prep:true },
    { id:"biobizkaia",   name:"Plataforma de Impresión 3D y Bioimpresión del IIS Biobizkaia (3B3D)", tema:"salud", page:16, lat:43.2835, lng:-2.9855, dir:"Hospital Universitario Cruces, Barakaldo", aprox:true, prep:true },
    { id:"lantegi",      name:"Lantegi Batuak", tema:"trabajo", page:17, lat:43.3000, lng:-2.9300, dir:"Txorierri etorbidea 12, 48180 Loiu (y red de centros)", aprox:true, prep:true },
    { id:"innitius",     name:"Innitius", tema:"salud", page:18, lat:43.2935, lng:-2.8690, dir:"Astondo Bidea 612, Parque Tecnológico de Bizkaia, 48160 Derio", aprox:true, prep:true },
    { id:"ekiola",       name:"Lea Artibaiko Ekiola S.Koop.", tema:"transversal", page:19, lat:43.2480, lng:-2.4800, dir:"Parque solar de Etxebarria, junto a la ETAP de Iparragirre", aprox:true, prep:true },
    { id:"ekhilur",      name:"Ekhilur E. Koop.", tema:"transversal", page:20, lat:43.2565, lng:-2.9215, dir:"Ekonopolo, Harrobi Plaza 4, 48003 Bilbao", aprox:true, prep:true },
    { id:"aholab",       name:"Aholab (EHU)", tema:"voz", page:21, lat:43.2625, lng:-2.9490, dir:"Escuela de Ingeniería de Bilbao, Plaza Ingeniero Torres Quevedo 1, 48013 Bilbao", aprox:true, prep:true },
    { id:"emeuskadi",    name:"EM Euskadi", tema:"salud", page:22, lat:43.2550, lng:-2.9350, dir:"Bilbao (dirección pendiente)", aprox:true, prep:true },
    { id:"argia",        name:"Argia Fundazioa", tema:"salud", page:23, lat:43.3300, lng:-3.0100, dir:"Trinidad 11, 48990 Getxo", aprox:true, prep:true },
    { id:"asparbi",      name:"Asparbi", tema:"voz", page:24, lat:43.2730, lng:-2.9650, dir:"San Ignacio, Bilbao (dirección pendiente)", aprox:true, prep:true }
  ];

  const EDITAR = new URLSearchParams(location.search).get("editar") === "1";
  const TACTIL = window.matchMedia("(hover: none), (max-width: 768px)").matches;

  const map = L.map("map").setView([43.25, -2.85], window.matchMedia("(max-width: 768px)").matches ? 9 : 10);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  // Título
  const titulo = L.control({ position: "topright" });
  titulo.onAdd = () => {
    const d = L.DomUtil.create("div", "titulo");
    d.textContent = "Futuros que se cultivan en Bizkaia. Tecnología para las personas";
    return d;
  };
  titulo.addTo(map);

  // Ficha en grande
  const overlay = document.getElementById("pdf-overlay");
  const pdfFrame = document.getElementById("pdf-frame");
  function abrirFicha(page) {
    const url = `viewer.html?file=${encodeURIComponent(PDF_FILE)}&page=${encodeURIComponent(page)}`;
    if (window.matchMedia("(max-width: 768px)").matches) { window.location.href = url; return; }
    pdfFrame.src = url;
    overlay.style.display = "flex";
  }
  function cerrarFicha() { overlay.style.display = "none"; pdfFrame.src = ""; }
  document.getElementById("close-btn").addEventListener("click", cerrarFicha);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrarFicha(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarFicha(); });

  // Pin SVG: el mismo del Vol. 1, verde musgo para todas las iniciativas
  const VERDE = "#177a3b";
  function createPinIcon(color, size) {
    const w = size, h = size * 1.4;
    const svg = `
      <svg width="${w}" height="${h}" viewBox="0 0 24 34" xmlns="http://www.w3.org/2000/svg">
        <g style="filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4))">
          <path d="M12 1 C7 1 3 5 3 10 C3 16 8 21 12 26 C16 21 21 16 21 10 C21 5 17 1 12 1 Z"
                fill="${color}" stroke="#333" stroke-width="1"/>
          <circle cx="12" cy="10" r="4" fill="white"/>
        </g>
      </svg>`;
    return L.divIcon({ html: svg, className: "pin-icon", iconSize: [w, h],
      iconAnchor: [w / 2, h], popupAnchor: [0, -h] });
  }

  const marcadores = [];

  iniciativas.forEach((it) => {
    const marker = L.marker([it.lat, it.lng], {
      icon: createPinIcon(VERDE, TACTIL ? 32 : 26),
      draggable: EDITAR,
      title: it.name
    });
    const tip = `<strong>${it.name}</strong><br><span class="dir">${it.dir}</span>` +
      (it.prep ? `<br><span class="prep">Ficha en preparación</span>` : "");
    if (TACTIL) {
      // Móvil y tableta: no hay "pasar por encima", así que el toque abre una tarjeta
      // con el nombre, la dirección y un botón para ver la ficha.
      marker.bindPopup(tip + `<br><button class="btn-ficha" type="button">Ver ficha</button>`,
        { closeButton: true, autoPanPadding: [20, 60] });
      marker.on("popupopen", (e) => {
        e.popup.getElement().querySelector(".btn-ficha")
          .addEventListener("click", () => abrirFicha(it.page));
      });
    } else {
      marker.bindTooltip(tip, { direction: "top", offset: [0, -30] });
      marker.on("click", () => { if (!EDITAR) abrirFicha(it.page); });
    }
    if (EDITAR) marker.on("dragend", volcarCoordenadas);
    marker.addTo(map);
    marcadores.push({ it, marker });
  });

  // Modo edición: arrastrar pins y copiar las coordenadas resultantes
  function volcarCoordenadas() {
    document.getElementById("salida").value = marcadores.map(({ it, marker }) => {
      const p = marker.getLatLng();
      return `${it.id}\t${p.lat.toFixed(5)}\t${p.lng.toFixed(5)}`;
    }).join("\n");
  }
  if (EDITAR) {
    document.getElementById("panel-editar").style.display = "block";
    volcarCoordenadas();
  }
</script>
</body>
</html>
